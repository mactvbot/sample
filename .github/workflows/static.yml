  var pc = ['122,31,66', '185,112,122', '232,181,174', '240,201,196'];
  function mk(init) { return { x: Math.random() * W, y: init ? Math.random() * H : -20, r: 3 + Math.random() * 5, vy: .25 + Math.random() * .6, ph: Math.random() * 6.28, sp: .01 + Math.random() * .02, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .03, c: pc[(Math.random() * pc.length) | 0], a: .25 + Math.random() * .4 }; }
  function init() { size(); var n = Math.round(Math.min(34, W * H / 26000)); P = []; for (var i = 0; i < n; i++) P.push(mk(true)); }
  function frame() {
    if (!run) return;
    cx.clearRect(0, 0, W, H);
    for (var i = 0; i < P.length; i++) {
