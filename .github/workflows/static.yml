<style>
/* Layout: a printed-invitation feel. Ivory paper, burgundy ink, gold foil line art. Portrait stands on a burgundy arch in front of oversized outlined lettering, then countdown rings, a burgundy venue band with a moving route, the invitation card on a tilting sheet, and a swipeable wishes deck. Single light look by choice. */
:root {
  --paper: #ffffff;
  --paper-2: #faf5f3;
  --ink: #56132c;
  --wine: #3f0d20;
  --crimson: #7a1f42;
  --gold: #b9707a;
  --gold-lt: #f0c9c4;
  --blush: #fcf6f4;
  --mute: #7a5a66;
  --line: rgba(185, 112, 122, .45);
  --display: "Cormorant Garamond", "Times New Roman", Georgia, serif;
  --label: "Cinzel", "Cormorant Garamond", Georgia, serif;
  --word: "Cinzel", "Cormorant Garamond", Georgia, serif;
  --script: "Pinyon Script", "Great Vibes", "Brush Script MT", cursive;
  --body: "Jost", "Noto Sans Malayalam", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
  background-image:
    radial-gradient(1200px 600px at 85% -10%, rgba(240, 201, 196, .35), transparent 60%),
    radial-gradient(900px 500px at -10% 40%, rgba(246, 227, 223, .8), transparent 60%);
  background-attachment: fixed;
}
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--crimson); outline-offset: 3px; border-radius: 6px; }
.wrap { width: 100%; max-width: 1120px; margin-inline: auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.up { font-size: .74rem; letter-spacing: .34em; text-transform: uppercase; font-weight: 500; }

/* progress + safe-area band */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--paper); }
.prog { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; height: 3px; width: 100%; z-index: 61; background: transparent; }
.prog i { display: block; height: 100%; width: 100%; transform-origin: 0 50%; transform: scaleX(0); background: linear-gradient(90deg, var(--gold), var(--crimson), var(--gold)); }
#petals { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
main, footer { position: relative; z-index: 2; }

/* ---------- hero ---------- */
.hero { overflow-x: clip; padding-block: clamp(26px, 5vw, 64px) clamp(30px, 5vw, 70px); }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(18px, 4vw, 64px); align-items: center; }
.top { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.top .up { color: var(--ink); font-family: var(--display); font-weight: 500; font-size: clamp(1.1rem, 3.4vw, 1.9rem); letter-spacing: .3em; }
.chal { width: clamp(70px, 14vw, 104px); height: auto; overflow: visible; }
.chal .d { fill: none; stroke: url(#foil); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.6s cubic-bezier(.6, .1, .3, 1) forwards; }
.chal .d2 { animation-delay: .5s; } .chal .d3 { animation-delay: 1s; } .chal .d4 { animation-delay: 1.5s; }
.chal .rays { transform-origin: 100px 62px; animation: spin 40s linear infinite; }
.chal .rays line { stroke: url(#foil); stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s ease-out 1.2s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }

.stage { container-type: inline-size; position: relative; width: min(100%, 440px); margin-inline: auto; aspect-ratio: 5 / 6.7; min-width: 0; }
.stage .arch { position: absolute; left: 6%; right: 6%; bottom: 0; height: 70%; border-radius: 999px 999px 0 0; background: linear-gradient(170deg, var(--crimson), var(--wine)); overflow: hidden; box-shadow: 0 30px 60px rgba(86, 19, 44, .28); }
.stage .arch::before { content: ""; position: absolute; inset: 0; background: repeating-conic-gradient(from 0deg at 50% 100%, rgba(240, 201, 196, .16) 0 5deg, transparent 5deg 15deg); animation: spin 90s linear infinite; transform-origin: 50% 100%; }
.stage .arch::after { content: ""; position: absolute; inset: 8px; border-radius: 999px 999px 0 0; border: 1px solid rgba(240, 201, 196, .6); border-bottom: 0; }
.stage .word { position: absolute; left: 0; right: 0; top: 7%; text-align: center; z-index: 2; font-family: var(--word); font-weight: 700; letter-spacing: .02em; line-height: .9; font-size: 24cqw; white-space: nowrap; color: transparent; -webkit-text-stroke: 1.6px var(--crimson); pointer-events: none; user-select: none; animation: slideword 1.6s cubic-bezier(.2, .7, .2, 1) both; }
.stage .word.fill { color: rgba(185, 112, 122, .22); -webkit-text-stroke: 0; }
@keyframes slideword { from { opacity: 0; transform: translateY(40px) scale(.96); letter-spacing: .18em; } to { opacity: 1; transform: none; } }
.stage .who { position: absolute; left: 50%; bottom: 0; height: 76%; width: auto; max-width: none; -webkit-mask-image: linear-gradient(#000 90%, transparent 100%); mask-image: linear-gradient(#000 90%, transparent 100%); transform: translateX(-50%); z-index: 3; transform-origin: 50% 100%; animation: rise 1.2s cubic-bezier(.2, .7, .2, 1) .15s backwards, breathe 8s ease-in-out 1.5s infinite; filter: drop-shadow(0 18px 28px rgba(63, 13, 32, .35)); }
@keyframes rise { from { opacity: 0; transform: translateX(-50%) translateY(50px); } }
@keyframes breathe { 50% { transform: translateX(-50%) scale(1.025); } }
.stage .spark { position: absolute; width: 10px; height: 10px; z-index: 4; background: var(--gold-lt); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: twinkle 3s ease-in-out infinite; }
.stage .s1 { left: 6%; top: 24%; } .stage .s2 { right: 4%; top: 38%; animation-delay: -1s; width: 14px; height: 14px; } .stage .s3 { left: 14%; top: 60%; animation-delay: -2s; width: 8px; height: 8px; }
@keyframes twinkle { 0%, 100% { transform: scale(.3) rotate(0); opacity: .2; } 50% { transform: scale(1.1) rotate(90deg); opacity: 1; } }

.copy { min-width: 0; }
.script-title { font-family: var(--script); font-size: clamp(2.6rem, 6.6vw, 4.6rem); line-height: 1.02; color: var(--crimson); }
.script-title span { display: block; }
.foil { background: linear-gradient(100deg, var(--gold) 0%, var(--gold-lt) 30%, var(--gold) 55%, #8f4a56 80%, var(--gold-lt) 100%); background-size: 240% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: foil 5s linear infinite; }
@keyframes foil { to { background-position: -240% 0; } }
.name { margin-top: 18px; font-family: var(--display); font-weight: 600; font-size: clamp(1.35rem, 3.2vw, 2.1rem); line-height: 1.25; color: var(--ink); }
.facts { margin-top: 22px; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: baseline; padding-block: 16px; border-block: 1px solid var(--line); }
.facts .k { color: var(--gold); }
.facts .v { font-family: var(--display); font-weight: 500; font-size: clamp(1.1rem, 2.6vw, 1.45rem); }
.cta { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px; }
.btn { appearance: none; border: 0; cursor: pointer; text-decoration: none; font: 500 .92rem/1 var(--body); letter-spacing: .06em; display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 15px 24px; border-radius: 4px; position: relative; overflow: hidden; transition: transform .25s, box-shadow .25s, background .25s; }
.btn svg { width: 19px; height: 19px; flex: none; }
.btn:hover { transform: translateY(-3px); }
.btn-wine { background: var(--ink); color: var(--paper); box-shadow: 0 10px 26px rgba(86, 19, 44, .3); }
.btn-wine::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(240, 201, 196, .55) 50%, transparent 70%); transform: translateX(-120%); animation: sweep 3.6s ease-in-out infinite; }
@keyframes sweep { 60%, 100% { transform: translateX(120%); } }
.btn-line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn-line:hover { background: var(--ink); color: var(--paper); }
.btn-wa { background: #1fa855; color: #fff; box-shadow: 0 10px 24px rgba(31, 168, 85, .3); }
.btn-gold { background: var(--gold-lt); color: var(--wine); }

@media (max-width: 860px) {
  .hero .wrap { grid-template-columns: minmax(0, 1fr); text-align: center; }
  .copy { text-align: center; }
  .facts { text-align: left; }
  .cta { justify-content: center; }
}

/* ---------- countdown: arched tiles ---------- */
.sec-head { text-align: center; margin-bottom: clamp(22px, 3.4vw, 40px); }
.sec-head .up { color: var(--gold); }
.sec-head h2 { font-family: var(--display); font-weight: 700; font-size: clamp(1.8rem, 4.6vw, 3rem); line-height: 1.1; margin-top: 10px; text-wrap: balance; }
.sec-head p { color: var(--mute); margin-top: 10px; }
.cd { position: relative; overflow: hidden; padding-block: clamp(56px, 8vw, 100px); background: linear-gradient(180deg, #fffaf8 0%, #f9eeeb 45%, #f2dfdb 100%); }
.cd-bg { display: none; }
.cd-bg { position: absolute; left: 50%; top: 50%; width: 150vmax; height: 150vmax; background: repeating-conic-gradient(from 0deg, rgba(185, 112, 122, .13) 0 3deg, transparent 3deg 12deg); -webkit-mask: radial-gradient(circle closest-side, #000 5%, transparent 62%); mask: radial-gradient(circle closest-side, #000 5%, transparent 62%); transform: translate(-50%, -50%); animation: cdspin 220s linear infinite; pointer-events: none; }
@keyframes cdspin { to { transform: translate(-50%, -50%) rotate(360deg); } }
.cd .wrap { position: relative; max-width: 900px; }
.cd-head { text-align: center; }
.cd-head .up { color: var(--gold); }
.cd-head h2 { font-family: var(--display); font-weight: 600; font-size: clamp(2rem, 5.4vw, 3.4rem); line-height: 1.08; margin-top: 12px; color: var(--ink); text-wrap: balance; }
.cd-head h2 em { display: block; font-family: var(--script); font-style: normal; font-weight: 400; color: var(--crimson); font-size: 1.3em; line-height: 1.15; }
.orn { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 14px; color: var(--gold); }
.orn i { display: block; width: clamp(50px, 14vw, 110px); height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
.orn i:last-child { transform: scaleX(-1); }
.orn svg { width: 22px; height: 22px; }
.cd-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(8px, 2.6vw, 26px); margin-top: clamp(26px, 4vw, 44px); }
.cd-u { text-align: center; }
.cd-arch { position: absolute; inset: 8%; display: grid; place-items: center; overflow: hidden; border-radius: 50%; background: var(--wine); border: 1.5px solid var(--gold); box-shadow: 0 22px 40px rgba(86, 19, 44, .28), inset 0 0 0 5px rgba(63, 13, 32, .55), inset 0 0 0 6px rgba(240, 201, 196, .4); }
.cd-arch::before { content: ""; position: absolute; inset: 0; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(240, 201, 196, .16) 0 5deg, transparent 5deg 15deg); }
.cd-arch::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, .22) 50%, transparent 60%); transform: translateX(-120%); animation: cdshine 7s ease-in-out infinite; }
.cd-u:nth-child(2) .cd-arch::after { animation-delay: .5s; } .cd-u:nth-child(3) .cd-arch::after { animation-delay: 1s; } .cd-u:nth-child(4) .cd-arch::after { animation-delay: 1.5s; }
@keyframes cdshine { 55%, 100% { transform: translateX(120%); } }
.cd-arch::before, .cd-arch::after { display: none; }
.cd-arch { background: radial-gradient(circle at 50% 35%, #e0a39d, var(--crimson) 70%); box-shadow: 0 18px 34px rgba(86, 19, 44, .25), inset 0 0 0 5px rgba(224, 163, 157, .85), inset 0 0 0 6px rgba(240, 201, 196, .55); }
.cd-arch b { background: linear-gradient(180deg, #fffaf8, #f3d3cc 50%, #d0928a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 1px 1px rgba(63, 13, 32, .35)); }
@keyframes cdglow { 50% { border-color: var(--gold-lt); box-shadow: 0 18px 34px rgba(86, 19, 44, .25), 0 0 30px rgba(240, 201, 196, .5), inset 0 0 0 5px rgba(224, 163, 157, .85), inset 0 0 0 6px rgba(240, 201, 196, .8); } }
.cd-u.sec .cd-arch { animation: cdglow 2s ease-in-out infinite; }
@keyframes cdglow { 50% { border-color: var(--gold-lt); box-shadow: 0 22px 40px rgba(86, 19, 44, .28), 0 0 30px rgba(240, 201, 196, .45), inset 0 0 0 5px rgba(63, 13, 32, .55), inset 0 0 0 6px rgba(240, 201, 196, .6); } }
.cd-arch b { position: relative; z-index: 1; padding-top: 0; font-family: var(--word); font-weight: 700; font-size: clamp(1.5rem, 7vw, 3.7rem); line-height: 1; font-variant-numeric: tabular-nums; background: linear-gradient(180deg, #fbeeea, #f0c9c4 45%, #a45a66); -webkit-background-clip: text; background-clip: text; color: transparent; }
.cd-arch b.tick { animation: cdin .55s cubic-bezier(.2, .8, .3, 1); }
@keyframes cdin { from { transform: translateY(45%) scale(.88); opacity: 0; filter: blur(3px); } }
.cd-rw { position: relative; aspect-ratio: 1; }
.cd-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.cd-ring circle { fill: none; stroke-width: 2.4; }
.cd-ring .r0 { stroke: var(--line); }
.cd-ring .r1 { stroke: url(#ringfoil); stroke-linecap: round; transition: stroke-dashoffset .9s cubic-bezier(.3, .8, .3, 1); filter: drop-shadow(0 0 2px rgba(185, 112, 122, .6)); }
.cd-u small { display: block; margin-top: 14px; font-family: var(--label); font-weight: 600; font-size: clamp(.58rem, 1.9vw, .8rem); letter-spacing: .28em; text-transform: uppercase; color: var(--ink); }
.cd-date { text-align: center; margin-top: clamp(26px, 4vw, 42px); font-family: var(--display); font-style: italic; font-size: clamp(1.15rem, 2.8vw, 1.55rem); color: var(--ink); }
.cd-date b { font-style: normal; font-weight: 700; color: var(--crimson); }
.cd-bar { position: relative; max-width: 520px; height: 2px; margin: 24px auto 0; background: var(--line); border-radius: 2px; }
.cd-bar span { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, var(--gold), var(--crimson)); border-radius: 2px; transition: width 1.4s cubic-bezier(.3, .8, .3, 1); }
.cd-bar svg { position: absolute; top: 50%; left: 0; width: 20px; height: 20px; margin: -10px 0 0 -10px; color: var(--crimson); transition: left 1.4s cubic-bezier(.3, .8, .3, 1); filter: drop-shadow(0 0 5px rgba(185, 112, 122, .8)); }
.cd-cap { margin-top: 16px; text-align: center; font-family: var(--label); font-size: .66rem; letter-spacing: .28em; text-transform: uppercase; color: var(--mute); }

/* ---------- venue band ---------- */
.venue { background: linear-gradient(160deg, var(--ink), var(--wine)); color: var(--paper); position: relative; overflow: hidden; padding-block: clamp(56px, 8vw, 100px); }
.venue::before { content: ""; position: absolute; width: 90vmin; height: 90vmin; right: -25vmin; top: -30vmin; border-radius: 50%; border: 1px solid rgba(240, 201, 196, .3); box-shadow: 0 0 0 5vmin rgba(240, 201, 196, .06), 0 0 0 11vmin rgba(240, 201, 196, .04); animation: spin 80s linear infinite; }
.venue .wrap { position: relative; display: grid; grid-template-columns: 1.1fr .9fr; gap: clamp(24px, 5vw, 70px); align-items: center; }
.venue .up { color: var(--gold-lt); }
.venue h2 { font-family: var(--display); font-weight: 700; font-size: clamp(2.2rem, 6vw, 4.2rem); line-height: 1.04; margin-top: 12px; text-wrap: balance; }
.venue h2 em { display: block; font-style: normal; font-family: var(--script); font-weight: 400; color: var(--gold-lt); font-size: 1.1em; }
.venue p { margin-top: 14px; color: rgba(253, 247, 244, .78); }
.when { display: flex; align-items: baseline; gap: 14px; margin-top: 22px; flex-wrap: wrap; }
.when .n { font-family: var(--display); font-weight: 800; font-size: clamp(4rem, 12vw, 7rem); line-height: .85; color: var(--gold-lt); }
.when .m { font-family: var(--display); font-size: clamp(1.2rem, 3vw, 1.7rem); line-height: 1.25; }
.when .m small { display: block; font-family: var(--body); letter-spacing: .26em; text-transform: uppercase; font-size: .7rem; color: var(--gold-lt); }
.venue .cta .btn-line { color: var(--paper); box-shadow: inset 0 0 0 1.5px rgba(253, 247, 244, .7); }
.venue .cta .btn-line:hover { background: var(--paper); color: var(--ink); }
.route { width: 100%; height: auto; overflow: visible; }
.route .path { fill: none; stroke: var(--gold-lt); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 2 10; animation: march 1.6s linear infinite; }
@keyframes march { to { stroke-dashoffset: -24; } }
.route .home { fill: var(--gold-lt); }
.route .pin { fill: var(--paper); transform-origin: 270px 80px; animation: bounce 2.2s ease-in-out infinite; }
.route .pulse { fill: none; stroke: var(--gold-lt); stroke-width: 2; transform-origin: 270px 128px; animation: ripple 2.2s ease-out infinite; }
@keyframes bounce { 50% { transform: translateY(-9px); } }
@keyframes ripple { from { transform: scale(.3); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }
.route text { font-family: var(--body); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; fill: var(--gold-lt); }
@media (max-width: 860px) { .venue .wrap { grid-template-columns: minmax(0, 1fr); } .route { max-width: 420px; margin-inline: auto; } }

/* ---------- invitation sheet ---------- */
.sheet { padding-block: clamp(56px, 8vw, 100px); }
.sheet .wrap { display: grid; grid-template-columns: 1.2fr .8fr; gap: clamp(24px, 5vw, 70px); align-items: center; }
.paper { perspective: 1200px; min-width: 0; }
.paper img { width: 100%; height: auto; display: block; border-radius: 6px; background: #fff; box-shadow: 0 2px 0 #fff inset, 0 34px 70px rgba(86, 19, 44, .28), 0 0 0 1px var(--line); transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .25s ease-out; }
.sheet h2 { font-family: var(--display); font-weight: 700; font-size: clamp(1.8rem, 4.2vw, 2.8rem); line-height: 1.1; margin-top: 10px; text-wrap: balance; }
.sheet .up { color: var(--gold); }
.sheet p { margin-top: 14px; color: var(--mute); max-width: 44ch; }
@media (max-width: 860px) { .sheet .wrap { grid-template-columns: minmax(0, 1fr); text-align: center; } .sheet p { margin-inline: auto; } .sheet .cta { justify-content: center; } }

/* ---------- wishes ---------- */
.wish { padding-block: clamp(50px, 8vw, 96px); background: linear-gradient(180deg, transparent, var(--blush) 22%, var(--blush)); }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 18px; }
.chip { appearance: none; cursor: pointer; font: 500 .85rem/1 var(--body); padding: 11px 18px; border-radius: 99px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); transition: all .25s; }
.chip:hover { background: rgba(86, 19, 44, .08); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.deck { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 6px 2px 18px; margin-inline: -2px; scrollbar-width: thin; scrollbar-color: var(--gold) transparent; }
.msg { scroll-snap-align: start; flex: 0 0 min(300px, 82%); text-align: left; appearance: none; cursor: pointer; font: 400 .95rem/1.55 var(--body); color: var(--ink); padding: 18px 18px 16px; border-radius: 6px; border: 1.5px solid transparent; background: #fff; box-shadow: 0 10px 26px rgba(86, 19, 44, .12); transition: transform .3s, border-color .3s; white-space: pre-wrap; }
.msg:hover { transform: translateY(-5px); }
.msg[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 14px 30px rgba(185, 112, 122, .3); }
.msg .tag { display: block; font-size: .64rem; letter-spacing: .26em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; font-weight: 500; }
.composer { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 12px; align-items: start; }
.box { background: #fff; border-radius: 8px; padding: clamp(18px, 3vw, 28px); box-shadow: 0 20px 50px rgba(86, 19, 44, .14); min-width: 0; }
label { display: block; font-size: .72rem; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; font-weight: 500; }
input, textarea { width: 100%; font: 400 1rem/1.5 var(--body); color: var(--ink); background: var(--paper); border: 1.5px solid var(--paper-2); border-radius: 6px; padding: 12px 14px; }
input:focus, textarea:focus { border-color: var(--gold); outline: none; }
input::placeholder, textarea::placeholder { color: rgba(86, 19, 44, .4); }
textarea { min-height: 150px; resize: vertical; }
.field { margin-bottom: 14px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .row2 { grid-template-columns: minmax(0, 1fr); } }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.note { margin-top: 12px; font-size: .85rem; color: var(--mute); min-height: 1.4em; }
.chat { background: #e6cdc8; border-radius: 8px; padding: 18px; min-height: 100%; background-image: radial-gradient(rgba(86, 19, 44, .07) 1.2px, transparent 1.4px); background-size: 16px 16px; }
.chat .hd { font-size: .72rem; letter-spacing: .22em; text-transform: uppercase; color: var(--mute); text-align: center; margin-bottom: 14px; }
.bubble { margin-left: auto; max-width: 92%; padding: 12px 14px 8px; border-radius: 14px 14px 3px 14px; background: #d9fdd3; color: #1b2a1c; font-size: .93rem; white-space: pre-wrap; word-break: break-word; box-shadow: 0 2px 6px rgba(0, 0, 0, .12); animation: pop .5s cubic-bezier(.3, 1.4, .5, 1); }
.bubble small { display: block; text-align: right; opacity: .55; margin-top: 4px; font-size: .68rem; }
@keyframes pop { from { transform: scale(.9) translateY(10px); opacity: 0; } }
@media (max-width: 860px) { .composer { grid-template-columns: minmax(0, 1fr); } }

footer { padding-block: 56px calc(96px + env(safe-area-inset-bottom, 0px)); text-align: center; background: var(--wine); color: var(--paper); }
footer .chal { margin-inline: auto; display: block; }
footer .sig { font-family: var(--script); font-size: clamp(2.4rem, 7vw, 4rem); color: var(--gold-lt); margin-top: 8px; }
footer p { color: rgba(253, 247, 244, .75); margin-top: 6px; }
footer .up { color: var(--gold-lt); margin-top: 18px; }

.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50; transition: opacity .3s, transform .3s; }
.fab.off { opacity: 0; transform: translateY(20px); pointer-events: none; }
.fab .btn { padding: 14px 20px; border-radius: 99px; }
.fab .btn::before { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 0 0 0 rgba(31, 168, 85, .6); animation: halo 2.4s ease-out infinite; }
@keyframes halo { to { box-shadow: 0 0 0 16px rgba(31, 168, 85, 0); } }
.cheer { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); opacity: 0; padding: 12px 20px; border-radius: 99px; background: var(--ink); color: var(--paper); font-weight: 500; z-index: 70; pointer-events: none; transition: all .35s; max-width: 90vw; text-align: center; }
.cheer.show { transform: translate(-50%, 0); opacity: 1; }

/* top action icons + template modal */
.tbar { display: flex; gap: clamp(16px, 5vw, 34px); justify-content: center; margin-bottom: 12px; }
.ti { display: flex; flex-direction: column; align-items: center; gap: 9px; width: 92px; text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); font: 500 .64rem/1.25 var(--body); letter-spacing: .14em; text-transform: uppercase; text-align: center; }
.ti { font-family: var(--display); font-weight: 600; letter-spacing: .16em; }
.ti i { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); color: var(--ink); border: 1.5px solid var(--gold); position: relative; box-shadow: 0 8px 20px rgba(86, 19, 44, .14), inset 0 0 0 3px var(--paper), inset 0 0 0 4px var(--line); transition: transform .25s, background .25s, color .25s, border-color .25s; }
.ti i::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 1px solid var(--line); }
.ti:hover i { transform: translateY(-3px); background: var(--ink); color: var(--gold-lt); border-color: var(--ink); }
.ti svg { width: 26px; height: 26px; color: inherit; }
.modal { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 14px; background: rgba(63, 13, 32, .78); }
.mbox { position: relative; width: 100%; max-width: 400px; max-height: 94vh; overflow: auto; background: var(--paper); border-radius: 12px; padding: 18px 18px 16px; text-align: center; }
.mbox h3 { font-family: var(--display); font-size: 1.3rem; color: var(--ink); margin-bottom: 12px; }
.mx { position: absolute; top: 8px; right: 10px; width: 36px; height: 36px; border: 0; background: none; font-size: 1.8rem; line-height: 1; color: var(--ink); cursor: pointer; }
#timg { height: min(52vh, 500px); width: auto; max-width: 100%; aspect-ratio: 9 / 16; border-radius: 8px; box-shadow: 0 14px 36px rgba(86, 19, 44, .3); background: var(--paper-2); }
.mbox .chips { margin: 14px 0 12px; }
.mbox .actions { justify-content: center; }

/* how to reach */
.reach { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-top: clamp(8px, 3vw, 28px); }
.rc { padding: 22px 20px; border: 1px solid rgba(240, 201, 196, .35); border-radius: 6px; background: rgba(253, 247, 244, .05); text-align: left; }
.rc svg { width: 30px; height: 30px; color: var(--gold-lt); display: block; }
.rc h3 { font-family: var(--display); font-weight: 600; font-size: 1.15rem; margin-top: 12px; color: var(--paper); }
.rc p { margin-top: 6px; font-size: .92rem; line-height: 1.55; color: rgba(253, 247, 244, .8); }
.rc p b { font-weight: 500; color: var(--gold-lt); }
.reach-h { grid-column: 1 / -1; margin-top: clamp(14px, 3vw, 30px); }
.reach-h .up { color: var(--gold-lt); }
.mapwrap { grid-column: 1 / -1; position: relative; height: clamp(300px, 52vw, 460px); border-radius: 8px; overflow: hidden; border: 1.5px solid rgba(240, 201, 196, .55); box-shadow: 0 0 0 5px rgba(240, 201, 196, .08), 0 24px 50px rgba(0, 0, 0, .35); background: var(--wine); }
.mapwrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.mapfb { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 20px; text-align: center; background: linear-gradient(160deg, var(--ink), var(--wine)); }
.mapfb svg { width: 40px; height: 40px; color: var(--gold-lt); }
.mapfb p { margin: 0; max-width: 34ch; }
.near { grid-column: 1 / -1; }
.near .chips { margin: 14px 0 18px; justify-content: flex-start; }
.near .chip { color: var(--paper); border-color: rgba(240, 201, 196, .6); }
.near .chip:hover { background: rgba(240, 201, 196, .15); }
.near .chip[aria-pressed="true"] { background: var(--gold-lt); color: var(--wine); border-color: var(--gold-lt); }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.pl { display: flex; flex-direction: column; }
.pl .dist { font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-lt); }
.pl h3 { margin-top: 6px; }
.pl p { flex: 1; }
.pl-l { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; }
.pl-l a { color: var(--gold-lt); font-size: .88rem; font-weight: 500; text-underline-offset: 3px; }
.gnote { margin-top: 16px; font-size: .8rem; color: rgba(253, 247, 244, .62); }

.reveal.in { animation: up .9s cubic-bezier(.2, .7, .2, 1) backwards; }
@keyframes up { from { opacity: .1; transform: translateY(34px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .001s !important; }
  html { scroll-behavior: auto; }
}

/* ---------- type upgrade: Cormorant Garamond + Cinzel + Pinyon Script ---------- */
body { font-variant-numeric: lining-nums; }
.up, .ti, .when .m small, .pl .dist { font-family: var(--label); }
.up { font-weight: 500; letter-spacing: .3em; font-size: .72rem; }
.top .up { font-weight: 600; letter-spacing: .34em; font-size: clamp(.95rem, 3vw, 1.5rem); }
.ti { font-size: .6rem; letter-spacing: .14em; }
.script-title { font-family: "Alex Brush", var(--script); font-weight: 400; font-size: clamp(3.1rem, 8.4vw, 5.8rem); line-height: 1.02; letter-spacing: 0; }
.script-title span { margin-top: 0; }
.script-title .foil { font-family: var(--label); font-style: normal; font-weight: 600; text-transform: uppercase; letter-spacing: .2em; font-size: clamp(.85rem, 2.3vw, 1.35rem); line-height: 1.3; margin-top: .9rem; }
.name { font-size: clamp(1.55rem, 3.7vw, 2.5rem); font-weight: 700; }
.facts .v { font-size: clamp(1.25rem, 2.9vw, 1.65rem); font-weight: 600; }
.sec-head h2, .sheet h2 { font-size: clamp(2rem, 5vw, 3.3rem); font-weight: 600; }
.venue h2 { font-size: clamp(2.5rem, 6.6vw, 4.7rem); font-weight: 600; }
.when .n { font-family: var(--word); font-weight: 700; font-size: clamp(3.4rem, 10vw, 6rem); }
.when .m { font-size: clamp(1.4rem, 3.4vw, 1.95rem); }
.rc h3 { font-size: 1.32rem; font-weight: 700; }
.mbox h3 { font-size: 1.5rem; font-weight: 600; }
footer .sig { font-size: clamp(2.9rem, 8vw, 4.8rem); }

/* ---------- countdown: decorative type + icons under hero details ---------- */
.copy .tbar { margin: 26px 0 8px; }
.cd-head .up { font-family: var(--label); font-weight: 600; font-size: clamp(.7rem, 2.2vw, .95rem); letter-spacing: .36em; color: var(--gold); }
.cd-head .up::before, .cd-head .up::after { content: "\2726"; display: inline-block; margin: 0 .9em; font-size: .85em; color: var(--gold); }
.cd-head h2 { font-family: var(--label); font-weight: 600; font-size: clamp(1.05rem, 3.3vw, 1.8rem); letter-spacing: .2em; text-transform: uppercase; color: var(--crimson); line-height: 1.5; margin-top: 8px; }
.cd-head h2 em { font-family: "Alex Brush", var(--script); font-size: clamp(3.4rem, 11vw, 6.4rem); font-weight: 400; letter-spacing: 0; text-transform: none; line-height: 1; margin-bottom: .1em; background: linear-gradient(100deg, var(--gold) 0%, var(--gold-lt) 30%, var(--gold) 55%, #8f4a56 80%, var(--gold-lt) 100%); background-size: 240% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: foil 5s linear infinite; filter: drop-shadow(0 2px 1px rgba(86, 19, 44, .18)); }
.orn svg { filter: drop-shadow(0 0 5px rgba(185, 112, 122, .6)); }
.cd-u small { color: var(--crimson); letter-spacing: .34em; font-weight: 700; }
.cd-u small::before { content: ""; display: block; width: 7px; height: 7px; margin: 0 auto 9px; background: var(--gold); transform: rotate(45deg); }
.cd-date { display: flex; flex-direction: column; align-items: center; gap: 6px; font-style: normal; }
.cd-date b { font-family: var(--display); font-style: italic; font-weight: 700; font-size: clamp(1.5rem, 4.4vw, 2.5rem); background: linear-gradient(100deg, var(--gold), var(--crimson) 50%, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.cd-date::before { content: "\2726  \2726  \2726"; font-size: .7rem; letter-spacing: .6em; color: var(--gold); }
.cd-date .t { font-family: var(--label); font-size: clamp(.7rem, 2vw, .9rem); letter-spacing: .3em; text-transform: uppercase; color: var(--ink); }
.cd-head h2 { text-wrap: balance; }
.cd-head h2 span { display: block; }
.cd-head h2 em { font-size: clamp(2rem, 6vw, 3.2rem); margin-bottom: .2em; }
.cd-head h2 .to { font-family: var(--display); font-style: italic; font-weight: 500; font-size: clamp(1.05rem, 2.8vw, 1.4rem); letter-spacing: .04em; text-transform: none; color: var(--ink); }
.cd-head h2 .ev { font-family: var(--label); font-weight: 700; font-size: clamp(.95rem, 3.1vw, 1.6rem); letter-spacing: .16em; line-height: 1.4; margin-top: 4px; color: var(--crimson); }
.cd-head h2 .who { font-family: var(--display); font-style: italic; font-weight: 700; font-size: clamp(1.15rem, 3.4vw, 1.8rem); letter-spacing: .01em; text-transform: none; color: var(--ink); margin-top: 8px; }

/* ---------- countdown: refined panel ---------- */
.cd-grid { position: relative; gap: 0; padding: clamp(22px, 4vw, 40px) clamp(4px, 1.5vw, 16px); background: linear-gradient(180deg, #fff, #fcf5f2); border: 1px solid var(--gold); border-radius: 12px; box-shadow: 0 24px 50px rgba(86, 19, 44, .12), 0 2px 0 rgba(255, 255, 255, .8) inset; }
.cd-grid::before { content: ""; position: absolute; inset: 6px; border: 1px solid rgba(185, 112, 122, .4); border-radius: 8px; pointer-events: none; }
.cd-u { position: relative; display: flex; flex-direction: column; align-items: center; }
.cd-u + .cd-u::before { content: ""; position: absolute; left: 0; top: 6%; bottom: 6%; width: 1px; background: linear-gradient(transparent, var(--gold), transparent); }
.cd-n { display: block; font-family: var(--word); font-weight: 700; font-size: clamp(2rem, 8.6vw, 4.8rem); line-height: 1; font-variant-numeric: tabular-nums; background: linear-gradient(180deg, var(--crimson), var(--ink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.cd-n.tick { animation: cdin .55s cubic-bezier(.2, .8, .3, 1); }
.cd-mini { display: block; position: relative; overflow: hidden; width: 46%; max-width: 96px; height: 2px; margin-top: clamp(10px, 2vw, 16px); background: var(--line); border-radius: 2px; }
.cd-mini u { position: absolute; inset: 0 auto 0 0; width: 0; text-decoration: none; background: linear-gradient(90deg, var(--gold), var(--crimson)); transition: width .9s cubic-bezier(.3, .8, .3, 1); }
.cd-u small { margin-top: 10px; letter-spacing: clamp(.1em, 1.3vw, .3em); }
.cd-u small::before { display: none; }
.cd-u.sec .cd-n { background: linear-gradient(180deg, var(--gold), #7a1f42); -webkit-background-clip: text; background-clip: text; }

/* ---------- countdown: slow colour drift ---------- */
@property --c1 { syntax: "<color>"; inherits: true; initial-value: #7a1f42; }
@property --c2 { syntax: "<color>"; inherits: true; initial-value: #3f0d20; }
.cd { background: linear-gradient(120deg, #fffaf8, #f8ebe7, #f1dedb, #faf0ed, #fffaf8); background-size: 320% 320%; animation: cdbg 26s ease-in-out infinite, cdcol 18s ease-in-out infinite; }
@keyframes cdbg { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
@keyframes cdcol { 0%, 100% { --c1: #7a1f42; --c2: #3f0d20; } 33% { --c1: #e0a39d; --c2: #4a1026; } 66% { --c1: #b9707a; --c2: #7a1f42; } }
.cd-n { background: linear-gradient(180deg, var(--c1), var(--c2)); -webkit-background-clip: text; background-clip: text; }
.cd-u.sec .cd-n { background: linear-gradient(180deg, var(--c2), var(--c1)); -webkit-background-clip: text; background-clip: text; }
.cd-grid { border-color: var(--c1); }
.cd-mini u { background: linear-gradient(90deg, var(--c1), var(--c2)); }
.cd-head h2 .ev, .cd-u small { color: var(--c1); }
.cd-head .up { font-family: var(--display); font-weight: 600; font-size: clamp(.95rem, 2.8vw, 1.3rem); letter-spacing: .32em; }
.cd-head h2 .ev { font-family: var(--display); font-style: italic; font-weight: 700; font-size: clamp(2rem, 6.4vw, 3.5rem); letter-spacing: .01em; text-transform: none; line-height: 1.15; margin-top: 6px; background: linear-gradient(100deg, #56132c 0%, #7a1f42 30%, #7a1f42 45%, #b9707a 55%, #7a1f42 70%, #56132c 100%); background-size: 240% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: foil 6s linear infinite; filter: drop-shadow(0 1px 0 rgba(255, 255, 255, .9)); }

/* ---------- countdown: back to round medallions ---------- */
@property --k1 { syntax: "<color>"; inherits: true; initial-value: #e0a39d; }
@property --k2 { syntax: "<color>"; inherits: true; initial-value: #7a1f42; }
@keyframes cdcol { 0%, 100% { --c1: #7a1f42; --c2: #3f0d20; --k1: #e0a39d; --k2: #7a1f42; } 33% { --c1: #e0a39d; --c2: #4a1026; --k1: #e0a39d; --k2: #4a1026; } 66% { --c1: #b9707a; --c2: #7a1f42; --k1: #b9707a; --k2: #3f0d20; } }
.cd-grid { gap: clamp(8px, 2.6vw, 26px); padding: 0; background: none; border: 0; box-shadow: none; border-radius: 0; }
.cd-grid::before, .cd-u + .cd-u::before { display: none; }
.cd-u { display: block; }
.cd-u small { display: block; margin-top: 14px; letter-spacing: clamp(.1em, 1.3vw, .28em); }
.cd-u small::before { display: block; }
.cd-arch { background: radial-gradient(circle at 50% 35%, var(--k1), var(--k2) 78%); }
</style>

