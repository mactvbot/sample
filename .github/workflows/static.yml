<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* chalice with sunburst, drawn as gold foil line art */
  var rays = '';
  for (var i = 0; i < 24; i++) {
    var a = i / 24 * Math.PI * 2, r1 = 33, r2 = i % 2 ? 42 : 52;
    rays += '<line pathLength="1" x1="' + (100 + Math.cos(a) * r1).toFixed(1) + '" y1="' + (62 + Math.sin(a) * r1).toFixed(1) + '" x2="' + (100 + Math.cos(a) * r2).toFixed(1) + '" y2="' + (62 + Math.sin(a) * r2).toFixed(1) + '"/>';
  }
  var chalice = '<g class="rays">' + rays + '</g><circle class="d" pathLength="1" cx="100" cy="62" r="26"/><path class="d d2" pathLength="1" d="M100 46v32M86 58h28"/><path class="d d2" pathLength="1" d="M50 98H150C150 134 128 152 100 152C72 152 50 134 50 98Z"/><path class="d d3" pathLength="1" d="M93 152C93 170 98 178 90 194H110C102 178 107 170 107 152"/><path class="d d4" pathLength="1" d="M64 218C64 200 84 194 100 194C116 194 136 200 136 218Z"/>';
  $('chalTop').innerHTML = chalice; $('chalFoot').innerHTML = chalice;

