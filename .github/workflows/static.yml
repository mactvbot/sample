  var rv = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { threshold: .12 });
    rv.forEach(function (el) { io.observe(el); });
  }

  /* scroll progress, tilt, fab */
  var pbar = $('pbar'), paper = $('paper'), fab = $('fab'), wishes = $('wishes'), ticking = false;
  function onScroll() {
    var max = document.documentElement.scrollHeight - innerHeight;
    pbar.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, scrollY / max) : 0) + ')';
    if (paper && !reduce) {
      var r = paper.getBoundingClientRect(), p = (r.top + r.height / 2 - innerHeight / 2) / innerHeight;
      paper.style.setProperty('--rx', (Math.max(-1, Math.min(1, p)) * 12).toFixed(1) + 'deg');
      paper.style.setProperty('--ry', (Math.max(-1, Math.min(1, p)) * -7).toFixed(1) + 'deg');
    }
    var w = wishes.getBoundingClientRect();
    fab.classList.toggle('off', (w.top < innerHeight * .6 && w.bottom > 0) || scrollY < 200);
    ticking = false;
  }
  addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
  addEventListener('resize', onScroll); onScroll();

  /* falling petals */
  var cv = $('petals'), cx = cv.getContext('2d'), W, H, P = [], run = true;
